<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEM Pulse | Forecast experiments</title><style>
:root{--bg:#09111f;--panel:#111d30;--border:#253650;--text:#e8f1ff;--muted:#9cb0ca;--blue:#55b7ff;--teal:#46dbc3;--amber:#ffbc69;--red:#ff7888}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{padding:24px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.brand{font-size:23px;font-weight:800;letter-spacing:-.7px}.brand span{color:var(--teal)}.badge{font-size:12px;background:#243b3b;color:#80f1d4;padding:7px 12px;border-radius:99px}.wrap{max-width:1250px;margin:auto;padding:32px 25px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--teal);font-weight:700}h1{font-size:34px;letter-spacing:-1px;margin:8px 0}p{color:var(--muted);line-height:1.55}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}button{background:#1a2a42;border:1px solid #344964;color:var(--text);border-radius:9px;padding:11px 18px;cursor:pointer;font-weight:600}button.active{background:#1c4b67;border-color:#5cc9e9;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}.value{font-size:30px;font-weight:800;margin:10px 0}.sub{font-size:12px;color:var(--muted)}.up{color:var(--teal)}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-top:16px}.panel h2{font-size:17px;margin:0 0 6px}.panel .caption{font-size:12px;margin:0 0 18px}.chart{width:100%;height:290px}.legend{display:flex;gap:20px;color:var(--muted);font-size:12px;margin-top:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.alerts{display:grid;gap:12px;margin-top:18px}.alert{background:#18263a;padding:14px;border-radius:10px;border-left:3px solid var(--amber);font-size:13px}.alert strong{display:block;margin-bottom:5px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.metricrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:11px 0;color:var(--muted)}.metricrow strong{color:var(--text)}.foot{font-size:12px;margin:26px 0;color:var(--muted)}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.bottom{grid-template-columns:1fr}.wrap{padding:22px 14px}h1{font-size:27px}.value{font-size:25px}}@media(max-width:430px){.cards{grid-template-columns:1fr 1fr}.card{padding:13px}.value{font-size:22px}}
a{color:var(--teal)}nav{display:flex;gap:24px;padding:16px 5%;border-bottom:1px solid var(--border)}nav a{text-decoration:none}nav a[aria-current]{font-weight:800;border-bottom:2px solid var(--teal)}label{display:flex;flex-direction:column;gap:6px;color:var(--muted)}input,select{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}.forecast-chart{width:100%;height:auto;min-height:250px}.legend{flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border)}#tooltip{position:fixed;z-index:99;pointer-events:none;white-space:pre-line;background:#f3f8ff;color:#102038;padding:12px;border-radius:8px;box-shadow:0 4px 20px #0008;max-width:320px}header{gap:12px;flex-wrap:wrap}.notice{border-left:3px solid var(--amber);padding:14px;background:var(--panel)}</style></head><body>
<header><div class="brand">⚡ NEM<span>Pulse</span></div><div class="badge" data-i="badge"></div><div><button data-lang="en">English</button> <button data-lang="zh">中文</button></div></header>
<nav aria-label="Main navigation"><a href="index.html" data-i="history"></a><a href="forecast.html" aria-current="page" data-i="forecast"></a></nav>
<main class="wrap"><div class="eyebrow" data-i="eyebrow"></div><h1 data-i="title"></h1><p data-i="intro"></p><p class="notice" data-i="notice"></p><p id="loadStatus" role="status"></p>

<section class="panel" style="margin-top:20px"><h2 data-i="comparison"></h2><p data-i="maeNote"></p><div class="tablewrap"><table><thead><tr><th data-i="model"></th><th>MAE (AUD/MWh)</th><th data-i="gain"></th></tr></thead><tbody id="comparisonRows"></tbody></table></div></section>
<section class="panel" style="margin-top:20px"><h2 data-i="method"></h2><p data-i="split"></p><p data-i="features"></p><p data-i="limits"></p><p><a href="../data/processed/vic_nonlinear_validation.csv" data-i="download"></a> · <a href="https://github.com/yangyinggit123/nem-pulse-energy-analytics/blob/main/scripts/train_nonlinear_model.py" data-i="source"></a></p></section>
</main><div id="tooltip" hidden role="status"></div><script src="forecast.js?v=1"></script></body></html>
